<head>
  <meta charset="UTF-8"/>

  <title>404 · Page Not Found · Enaly</title>
  <meta name="description" content="This page does not exist. Head back to the Enaly homepage.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#000000">

  <!-- Favicon (white lightning) -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Absolute paths: GitHub Pages serves this file for any missing URL, including nested ones -->
  <link rel="stylesheet" href="/css/enaly.css?v=20261106a">

  <style>
    /* ==================== 404 · signal lost ==================== */
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }
    .err-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem var(--gutter);
    }
    .err-top img { height: 22px; width: auto; filter: brightness(0) invert(1); }

    .err-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 1.5rem var(--gutter) 3rem;
      text-align: center;
    }

    .error-code {
      position: relative;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(11rem, 42vw, 28rem);
      line-height: 0.78;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      user-select: none;
    }
    .error-code::before,
    .error-code::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .error-code::before {
      color: var(--pink);
      mix-blend-mode: screen;
      animation: glitchA 3.2s infinite steps(1);
    }
    .error-code::after {
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.35);
      animation: glitchB 3.2s infinite steps(1);
    }
    @keyframes glitchA {
      0%, 86%, 100% { transform: translate(0, 0); clip-path: inset(0 0 0 0); opacity: 0; }
      87% { transform: translate(-6px, 2px); clip-path: inset(12% 0 60% 0); opacity: 1; }
      90% { transform: translate(5px, -3px); clip-path: inset(55% 0 20% 0); opacity: 1; }
      93% { transform: translate(-3px, 1px); clip-path: inset(30% 0 45% 0); opacity: 1; }
      96% { transform: translate(0, 0); opacity: 0; }
    }
    @keyframes glitchB {
      0%, 86%, 100% { transform: translate(0, 0); }
      88% { transform: translate(8px, -2px); }
      91% { transform: translate(-7px, 3px); }
      94% { transform: translate(3px, 0); }
    }

    /* Waveform flatline */
    .flatline {
      width: min(520px, 90%);
      height: 48px;
      margin: 1.5rem auto 0;
      color: var(--pink);
    }
    .flatline path {
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      animation: draw 2.2s 0.3s ease-out forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .error-message {
      margin-top: 1.25rem;
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .error-sub {
      margin: 0.5rem auto 2.25rem;
      max-width: 60ch;
      text-wrap: balance; /* if it has to wrap (phones), split the lines evenly – never one lonely word */
      color: var(--text-secondary);
      font-size: 0.98rem;
    }

    .err-actions { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
    /* small legal links at the bottom */
    .err-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1.25rem;
      flex-wrap: wrap;
      padding: 1.25rem max(var(--gutter), calc((100% - 1180px) / 2 + var(--gutter))) 1.5rem;
      border-top: 1px solid var(--hairline);
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text-secondary);
    }
    .err-legal { display: flex; gap: 1.25rem; }
    @media (max-width: 640px) {
      .err-footer { flex-direction: column; justify-content: center; text-align: center; }
    }
    .err-footer a {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      transition: color var(--transition-fast);
    }
    .err-footer a:hover { color: var(--pink); }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="err-top">
    <a href="/" aria-label="Enaly Home"><img src="/assets/logo.png" alt="Enaly Logo"></a>
  </header>

  <main class="err-main">
    <div>
      <h1 class="error-code" data-text="404" aria-label="404">404</h1>

      <svg class="flatline" viewBox="0 0 520 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M0 24h150l10-16 12 32 10-28 8 20 6-8h324"/>
      </svg>

      <p class="error-message">Logical Error // Page not found</p>
      <p class="error-sub">The page you are looking for does not exist or has moved.</p>

      <div class="err-actions">
        <a href="/" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>
          Back to Main Page
        </a>
      </div>
    </div>
  </main>

  <footer class="err-footer">
    <p>© 2026 Enaly. All rights reserved.</p>
    <nav class="err-legal" aria-label="Legal">
      <a href="/imprint">Imprint</a>
      <a href="/privacy-policies">Privacy Policies</a>
    </nav>
  </footer>
</body>
</html>
