  <style>
    /* ==================== 404 · signal lost ==================== */
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }
    .err-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem var(--gutter);
    }
    .err-top img { height: 22px; width: auto; filter: brightness(0) invert(1); }
    .err-top .code-chip {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 0.35rem 0.8rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--glass-border);
    }

    .err-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 2rem var(--gutter) 4rem;
      text-align: center;
    }

    .error-code {
      position: relative;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(11rem, 42vw, 28rem);
      line-height: 0.78;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      user-select: none;
    }
    .error-code::before,
    .error-code::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .error-code::before {
      color: var(--pink);
      mix-blend-mode: screen;
      animation: glitchA 3.2s infinite steps(1);
    }
    .error-code::after {
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.35);
      animation: glitchB 3.2s infinite steps(1);
    }
    @keyframes glitchA {
      0%, 86%, 100% { transform: translate(0, 0); clip-path: inset(0 0 0 0); opacity: 0; }
      87% { transform: translate(-6px, 2px); clip-path: inset(12% 0 60% 0); opacity: 1; }
      90% { transform: translate(5px, -3px); clip-path: inset(55% 0 20% 0); opacity: 1; }
      93% { transform: translate(-3px, 1px); clip-path: inset(30% 0 45% 0); opacity: 1; }
      96% { transform: translate(0, 0); opacity: 0; }
    }
    @keyframes glitchB {
      0%, 86%, 100% { transform: translate(0, 0); }
      88% { transform: translate(8px, -2px); }
      91% { transform: translate(-7px, 3px); }
      94% { transform: translate(3px, 0); }
    }

    /* Waveform flatline */
    .flatline {
      width: min(520px, 90%);
      height: 48px;
      margin: 1.5rem auto 0;
      color: var(--pink);
    }
    .flatline path {
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      animation: draw 2.2s 0.3s ease-out forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .error-message {
      margin-top: 1.25rem;
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .error-sub {
      margin: 0.5rem auto 2.25rem;
      max-width: 42ch;
      color: var(--text-secondary);
      font-size: 0.98rem;
    }

    .err-actions { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
    .err-links {
      margin-top: 2.25rem;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .err-links a {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--hairline);
      cursor: pointer;
      transition: color var(--transition-fast), border-color var(--transition-fast);
    }
    .err-links a:hover { color: var(--text-primary); border-color: var(--pink-line); }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="err-top">
    <a href="/" aria-label="Enaly Home"><img src="/assets/logo.png" alt="Enaly Logo"></a>
    <span class="code-chip">Error 404</span>
  </header>

  <main class="err-main">
    <div>
      <h1 class="error-code" data-text="404" aria-label="404">404</h1>

      <svg class="flatline" viewBox="0 0 520 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M0 24h150l10-16 12 32 10-28 8 20 6-8h324"/>
      </svg>

      <p class="error-message">Logical Error // Page not found</p>
      <p class="error-sub">The page you are looking for does not exist or has moved.</p>

        <a href="/" class="btn btn-primary">

          Back to Main Page
        </a>
        <a href="/booking" class="btn btn-ghost">Booking</a>
      </div>

      <nav class="err-links" aria-label="Quick links">
        <a href="/#about">About</a>
        <a href="/#events">Events</a>
        <a href="/imprint">Imprint</a>
        <a href="/privacy-policies">Privacy Policies</a>
      </nav>
    </div>
  </main>
</body>
</html>
