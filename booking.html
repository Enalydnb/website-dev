  <!-- Start loading content.json right away: it says which images to show,
       so no old/default picture flashes up before the chosen one -->
  <script>
    window.enalyContent = fetch('data/content.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  </script>

  <style>

    /* images chosen in the admin dashboard: invisible until the right picture has loaded */
    img[data-dynamic] { opacity: 0; transition: opacity 0.5s ease; }
    img[data-dynamic].is-loaded { opacity: 1; }
    /* ==================== BOOKING · split screen ==================== */
    .booking-split {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
    }

    /* Left: full-height photo with headline */
    .booking-visual {
      /* as tall as the form column: photo, headline and form box end on the same line */
      position: relative;
      min-height: 560px;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(1.5rem, 4vw, 3rem);
      padding-top: 2rem;
    }
    .booking-visual > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      animation: imgIn 1.4s cubic-bezier(.2,.7,.2,1) both;
    }
    .booking-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.1) 35%, rgba(0,0,0,0.85) 100%),
        linear-gradient(90deg, transparent 70%, #000 100%);
    }
    @keyframes imgIn { from { transform: scale(1.08); } to { transform: scale(1); } }

    .booking-home {
      position: absolute;
      top: clamp(1.25rem, 3vw, 2rem);
      left: clamp(1.5rem, 4vw, 3rem);
      display: inline-flex;
      cursor: pointer;
      transition: opacity var(--transition-fast);
    }
    .booking-home img { height: 24px; width: auto; filter: brightness(0) invert(1); }
    .booking-home:hover { opacity: 0.75; }


    .booking-visual h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(3.4rem, 6.5vw, 7rem);
      line-height: 0.86;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      overflow-wrap: break-word;
    }

    /* Right: contact + form */
    .booking-content {
      /* Desktop: content sits at the bottom of the first screen, so the form box ends
         level with the headline on the left (same bottom padding as the photo side) */
      /* top of the text level with the logo, bottom of the form level with the headline */
      padding: clamp(1.25rem, 3vw, 2rem) clamp(1.25rem, 5vw, 4rem) clamp(1.5rem, 4vw, 3rem);
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      max-width: 760px;
    }
    .booking-content > p {
      font-size: clamp(1.05rem, 1.5vw, 1.2rem);
      line-height: 1.7;
      color: var(--text-muted);
      max-width: 48ch;
    }
    .booking-content > p a {
      color: var(--text-primary);
      text-decoration: underline;
      text-decoration-color: var(--pink);
      text-underline-offset: 3px;
      transition: color var(--transition-fast);
    }
    .booking-content > p a:hover { color: var(--pink); }

    .contact-strip { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    .mail-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.55rem 1rem 0.55rem 0.55rem;
      border-radius: var(--radius-pill);
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--glass-border);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: border-color var(--transition-fast), background var(--transition-fast);
    }
    .mail-chip:hover { border-color: var(--pink); background: rgba(255,0,110,0.08); }
    .mail-chip .ic {
      width: 34px; height: 34px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--pink); color: #fff;
    }
    .mail-chip .ic svg { width: 17px; height: 17px; }
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.7rem 1rem;
      border-radius: var(--radius-pill);
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: color var(--transition-fast), border-color var(--transition-fast);
    }
    .copy-btn svg { width: 15px; height: 15px; }
    .copy-btn:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.25); }
    .copy-btn.is-done { color: var(--green); border-color: rgba(0,230,118,0.4); }

    /* Form (same component as on the homepage) */
    .form-card { padding: 0; }
    .booking-form {
      padding: clamp(1.4rem, 4vw, 2.25rem);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.1rem 1rem;
      align-content: start;
    }
    .booking-form .span-2 { grid-column: 1 / -1; }
    .form-intro {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .form-intro strong {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.7rem;
      letter-spacing: 0.05em;
      color: var(--text-primary);
    }
    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }
    .cf-turnstile { min-height: 65px; }
    #formStatus {
      grid-column: 1 / -1;
      display: none;
      align-items: flex-start;
      gap: 0.7rem;
      padding: 0.9rem 1rem;
      border-radius: var(--radius-inner);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    #formStatus.is-visible { display: flex; }
    #formStatus svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 0.1rem; }
    #formStatus.success { background: rgba(0,230,118,0.08); border: 1px solid rgba(0,230,118,0.35); color: var(--green); }
    #formStatus.error { background: var(--pink-soft); border: 1px solid var(--pink-line); color: #ff5c9e; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .booking-page .site-footer { margin-top: 0; }

    /* Desktop: everything fits on one screen (like iamflowz.de) –
       text top-right level with the logo, form box bottom level with the headline */
    @media (min-width: 901px) {
      .booking-split { min-height: 100svh; }
      .booking-content { gap: 1.25rem; }
      .booking-content .form-card { margin-top: auto; }
      .booking-form { padding: 1.5rem 1.75rem; gap: 0.8rem 1rem; }
      .form-intro { margin-bottom: 0; }
      .form-intro strong { font-size: 1.55rem; }
      .booking-form .field { gap: 0.35rem; }
      .booking-form .field input, .booking-form .field textarea { padding: 0.65rem 0.9rem; }
      .booking-form .field textarea { min-height: 84px; }
      .booking-form .form-actions { margin-top: 0.15rem; }
    }
    @media (max-width: 900px) {
      .booking-split { grid-template-columns: 1fr; min-height: 0; }
      .booking-visual {
        position: relative;
        height: auto;
        min-height: 62svh;
      }
      .booking-visual::after {
        background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.1) 40%, #000 100%);
      }
      .booking-content { max-width: none; padding-top: 0.5rem; padding-bottom: clamp(2rem, 5vw, 3rem); }
    }
    @media (max-width: 600px) {
      .booking-form { grid-template-columns: 1fr; }
    }
  </style>
</head>

    <div class="booking-content">
      <p>Send your booking inquiry through the form or email directly.</p>

      <div class="contact-strip">
        <a href="mailto:info@enaly.de" class="mail-chip">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>

        <button type="button" class="copy-btn" id="copyMail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span>Copy address</span>
        </button>
      </div>

      <div class="form-card glass">
          <form id="bookingForm" class="booking-form" novalidate>
            <div class="form-intro">
              <strong>Booking Inquiry</strong>
              <span>* required</span>
            </div>

            <div class="field">
              <label for="f-name">Name<span class="req">*</span></label>
              <input id="f-name" type="text" name="name" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="f-email">E-Mail<span class="req">*</span></label>
              <input id="f-email" type="email" name="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="f-event">Event / Promoter<span class="req">*</span></label>
              <input id="f-event" type="text" name="event" required>
            </div>
            <div class="field">
              <label for="f-date">Date<span class="req">*</span></label>
              <input id="f-date" type="text" name="date" placeholder="DD.MM.YYYY" inputmode="numeric" required>
            </div>
            <div class="field span-2">
              <label for="f-location">City / Venue<span class="req">*</span></label>
              <input id="f-location" type="text" name="location" placeholder="City, Venue" required>
            </div>
            <div class="field span-2">
              <label for="f-message">Message</label>
              <textarea id="f-message" name="message" rows="3"></textarea>
            </div>

            <div class="form-actions">
              <!-- Cloudflare Turnstile captcha widget -->
              <div class="cf-turnstile" data-sitekey="0x4AAAAAAE1CwQInEPI7M0NS" data-theme="dark"></div>

              <button type="submit" id="submitBtn" class="btn btn-primary">
                <span class="btn-text">Send Inquiry</span>
                <svg class="icon-shift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
              </button>
            </div>

            <div id="formStatus" role="status" aria-live="polite"></div>
          </form>
      </div>
    </div>
  </main>

  <script>
    // Booking image: the one chosen in the admin dashboard, faded in once loaded
    (async function () {
      const img = document.getElementById('imgWorking');
      const c = (await window.enalyContent) || {};
      const done = () => img.classList.add('is-loaded');
      img.addEventListener('load', done, { once: true });
      img.addEventListener('error', done, { once: true });
      img.src = c.imgWorking || 'assets/working.jpg';
      if (img.complete && img.naturalWidth) done();
    })();

    // Copy e-mail address
    document.getElementById('copyMail').addEventListener('click', async function () {
      const label = this.querySelector('span');
      try {
        await navigator.clipboard.writeText('info@enaly.de');
        this.classList.add('is-done');
        label.textContent = 'Copied';
      } catch (e) {
        label.textContent = 'info@enaly.de';
      }
      setTimeout(() => { this.classList.remove('is-done'); label.textContent = 'Copy address'; }, 2200);
    });
  </script>
